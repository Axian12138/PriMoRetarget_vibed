[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primoretarget"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mujoco"]

[project.scripts]
primoretarget = "primoretarget.cli:main"
primoretarget-episode = "primoretarget.episode:main"

[tool.setuptools.packages.find]
where = ["src"]
